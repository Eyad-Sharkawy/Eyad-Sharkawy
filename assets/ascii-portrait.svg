      <tspan x="185" y="116.8" text-anchor="middle" opacity="0.95">        .:::::  #   #  :::::.      </tspan>
      <tspan x="185" y="129.0" text-anchor="middle" opacity="0.95">        ::::::  ====   ::::::      </tspan>
      <tspan x="185" y="141.2" text-anchor="middle" opacity="0.95">        ::::::   ---   ::::::      </tspan>
      <tspan x="185" y="153.4" text-anchor="middle" opacity="0.75">        ':::::.       .:::::'      </tspan>
      <tspan x="185" y="165.6" text-anchor="middle" opacity="0.75">         '::::::.....::::::'       </tspan>
