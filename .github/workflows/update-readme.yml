name: Update Profile SVGs

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:       # Allows manual trigger from Actions tab
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'assets/source-avatar.jpg'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 numpy pillow

      - name: Render All SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_all.py

      - name: Commit updated SVGs and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.svg assets/*.svg data/*.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update profile SVGs and stats [skip ci]"
          git push
